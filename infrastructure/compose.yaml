name: engeradios2

services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: engeradios2-postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/18/docker

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    networks:
      - backend

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4.11-bookworm
    container_name: engeradios2-redis
    restart: unless-stopped

    env_file:
      - .env

    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"

    volumes:
      - redis_data:/data

    networks:
      - backend

    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    security_opt:
      - no-new-privileges:true

networks:
  backend:
    name: engeradios2_backend
    driver: bridge

volumes:
  postgres_data:
    name: engeradios2_postgres_data

  redis_data:
    name: engeradios2_redis_data
